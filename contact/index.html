<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | TheRainShark</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="../assets/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg" />
  <link rel="shortcut icon" href="../assets/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="TheRainShark" />
  <link rel="manifest" href="../assets/favicon/site.webmanifest" />

  <link rel="stylesheet" href="../assets/styles/style.css">
  <link rel="stylesheet" href="../assets/styles/contact.css">
</head>

<body>
    <nav id="navbar"></nav>

    <header>
        <h1>Contact</h1>
        <p>
            All the ways you can contact me.
        </p>
    </header>
    <main>
        <section id="contact-me" class="area">
            <h2>Contact me</h2>
            <div class="contacts">
                <span class="design-line"></span>
                <ul class="contact-list">
                    <li><strong>email:</strong> therainshark@gmail.com</li>
                    <li><strong>discord:</strong> informaplejr</li>
                </ul>
            </div>
            
        </section>

        <section class="part">
            <h2>Write me</h2>
            <form action="../error/">
                <fieldset>
                    <legend for="name">First Name</legend>
                    <input type="text" name="name" id="name" placeholder="Enter your name here...">
                </fieldset>
                <fieldset>
                    <legend for="surname">Second Name</legend>
                    <input type="text" name="surname" id="surname" placeholder="Your surename here...">
                </fieldset>
                <fieldset>
                    <legend for="email">Email</legend>
                    <input type="email" name="email" id="email" placeholder="Enter your email here...">
                </fieldset>
                <fieldset>
                    <legend for="topic">Topic</legend>
                    <input type="text" name="topic" id="topic" placeholder="Enter the topic here...">
                </fieldset>
                <fieldset>
                    <legend for="message">Message</legend>
                    <textarea name="message" id="message" placeholder="Write your message here..."></textarea>
                </fieldset>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <footer id="footer"></footer>

    <script type="module" src="../assets/main.js"></script>
</body>
